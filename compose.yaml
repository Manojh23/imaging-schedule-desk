services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: imaging
      POSTGRES_USER: imaging
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U imaging -d imaging"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes: [imaging_data:/var/lib/postgresql/data]
  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/imaging
      DATABASE_USER: imaging
      DATABASE_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
volumes:
  imaging_data:

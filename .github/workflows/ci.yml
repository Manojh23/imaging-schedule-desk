name: PostgreSQL integration tests and frontend build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: imaging
          POSTGRES_DB: imaging_test
          POSTGRES_PASSWORD: integration-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imaging -d imaging_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/imaging_test
      DATABASE_USER: imaging
      DATABASE_PASSWORD: integration-test-password
      SCHEDULE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: mvn -B -ntp test
      - run: npm ci && npm run build
        working-directory: web
